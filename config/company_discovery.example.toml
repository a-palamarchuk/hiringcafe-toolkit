# Copy to company_discovery.toml (gitignored) and fill in real values.

[search]
# The search itself is NOT defined here. Build it in the hiring.cafe UI, copy
# the searchState parameter out of the page URL, URL-decode it, and save it as
# JSON. This file only points at it. Relative paths resolve against this file.
searchstate_path = "searchstates/local-30mi.json"

[scrape]
# Seconds between page requests. Keep a real delay: this is an undocumented
# internal API and the point is to be an unremarkable client, not a fast one.
delay_seconds = 1.0
# Safety ceiling on pages per run. A run that hits it did not finish.
max_pages = 500

# Distances are measured from here. Required: without it a distance column
# would silently be measured from somewhere meaningless.
[home]
latitude = 0.0
longitude = 0.0

[location]
# Re-checked locally during rollup. A scraped posting matched on *any* of its
# locations, which may be nowhere near home, so the radius is applied again
# per workplace city.
radius_miles = 30
# A posting survives if at least one of its in-radius cities is outside these
# states, so a company with both a nearby office and an excluded one is kept.
# Full state names, matching the form the records use.
excluded_states = []

[filters]
# ATS sources dropped entirely. Public-sector boards belong here: they are
# government agencies, school districts, and counties rather than companies
# with a career page worth reviewing.
excluded_sources = [
    "usagov",
    "governmentjobs",
    "winocular",
    "schoolspring",
    "peopleadmin",
    "oraclepeoplesoft",
]
# Company website suffixes dropped regardless of ATS. Source exclusion cannot
# catch an agency, county, or university that uses a mainstream ATS, so their
# domains are excluded too.
excluded_website_tlds = [".mil", ".gov", ".edu"]

[visit_logger]
# JSON export from the VisitLogger browser extension, keyed by website host.
# Companies whose site appears there are dropped during the filter stage.
# Relative paths resolve against this file.
export_path = "../data/inputs/visitlogger-export.json"
