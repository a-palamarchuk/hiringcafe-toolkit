# Copy to job_shortlist.toml (gitignored) and fill in real values.

[search]
# The search itself is NOT defined here. Build it in the hiring.cafe UI, copy
# the searchState parameter out of the page URL, URL-decode it, and save it as
# JSON. This file only points at it. Relative paths resolve against this file.
#
# For this pipeline, keep dateFetchedPastNDays at 21 ("2 weeks" in the UI, a
# 21-day fetch window). The window is a missed-run recovery buffer, not a
# freshness filter - freshness comes from the diff stage. Three weeks of slack
# costs about a minute of scraping.
#
# Several searches are scraped in order into one raw file, so a job found by
# more than one is written, screened, and surfaced once. The remote search has
# no location, only the top-level workplaceTypes = ["Remote"] (results came
# back US-scoped and in USD when probed); give it the same departments,
# commitment, and clearance filters as the local one, plus the UI's salary
# filter at comp_floor with "Transparent salaries only" OFF - that filter keeps
# postings stating no salary, and cuts a nationwide search to a scrapeable size.
searchstate_paths = [
    "searchstates/local-30mi-short.json",
    "searchstates/remote-us.json",
]

[scrape]
# Seconds between page requests. Keep a real delay: this is an undocumented
# internal API and the point is to be an unremarkable client, not a fast one.
delay_seconds = 1.0
# Safety ceiling on pages per run. A run that hits it did not finish.
max_pages = 500
# Gzip the raw records (~7x on this data). Unlike company discovery, this
# pipeline runs daily and keeps every snapshot, so uncompressed raw output
# reaches several GB within a year. Reading accepts both forms, so flipping
# this off later does not strand existing files.
compress = true

[screen]
# A posting whose STATED ceiling falls below this is rejected. Postings that
# state nothing are never rejected on compensation - roughly a fifth of results
# disclose no salary, and they include some of the best matches.
comp_floor = 190000

# A stated band whose BOTTOM falls below this is demoted, not rejected. A wide
# band means the ceiling may belong to a different level or a pricier metro
# than this one.
comp_min_floor = 130000

# Cities in one posting before its band is treated as geo-tiered. Measured:
# postings spanning five or more cities have a median band spread of 53%
# against 30% for a single city, so their maximum is the priciest metro's
# figure rather than a local one. Demotes, never rejects.
wide_geography_cities = 5

# Companies never worth surfacing, matched case-insensitively against the
# company name. Unlike company discovery, where a bad company costs one glance,
# a staffing firm here can flood the list every day. Populate this from the
# repeat offenders in the screen output rather than guessing up front.
company_blocklist = []

[visit_logger]
# JSON export from the VisitLogger browser extension. Read by the diff stage for
# `opened` and `applied` labels, and by render to mark employers a resume has
# already gone to. Neither suppression nor rendering depends on it, so an absent
# file costs data rather than a run. Relative paths resolve against this file.
#
# Shared with the company-discovery pipeline: the extension exports all of local
# storage as one object, and posting keys are prefixed `job:` to keep the two
# apart. Point both configs at the same file.
export_path = "../data/inputs/visitlogger-export.json"
