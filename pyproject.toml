[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hiringcafe-toolkit"
version = "0.1.0"
description = "Personal pipelines for company and job-posting discovery, built on hiring.cafe's job-search API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Andriy Palamarchuk" }]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
]

[project.scripts]
hiringcafe-toolkit = "hiringcafe_toolkit.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "mypy>=1.11",
    "pre-commit>=3.7",
]
[tool.hatch.build.targets.wheel]
packages = ["src/hiringcafe_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
